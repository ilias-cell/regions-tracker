services:
  - type: web
    name: regions-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Путь к БД на постоянном диске, чтобы данные не терялись при рестарте
      - key: DB_PATH
        value: /var/data/tracker.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
